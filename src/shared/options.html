<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Torpedo Options</title>
    <link rel="stylesheet" href="css/options.css" />

    <script src="js/lib/floating-ui.core.umd.min.js"></script>
    <script src="js/lib/floating-ui.dom.umd.min.js"></script>
    <script src="js/lib/browser-polyfill.min.js"></script>

    <script type="module" src="js/options.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/torpedo.js"></script>
    <script src="js/publicsuffixlist.js"></script>
    <script src="js/punycode.js"></script>
</head>

<body>
    <h1 id="options-title"></h1>

    <nav class="tabs">
        <ul class="tab-links">
            <li><a href="#tab1" class="tab-link active">Timer</a></li>
            <li><a href="#tab2" class="tab-link">Domains</a></li>
            <li><a href="#tab3" class="tab-link">Redirect</a></li>
		    <li><a href="#tab4" class="tab-link">Short-URL</a></li>
            <li><a href="#tab5" class="tab-link">Tooltip</a></li>
            <li><a href="#tab6" class="tab-link">Tutorial</a></li>
        </ul>
    </nav>

    <div class="tab-content">
        <div id="tab1" class="tab active">
            <div class="form-section">

                <div class="form-group">
                    <input id="timerCheckbox" type="checkbox">
                    <label for="timerCheckbox" id="timerCheckboxText"></label>
                </div>

                <div id="timerChildSection" class="child-section">
                    <div class="form-group">
                        <label for="timerInput" id="timerInputPrefix"></label>
                        <input id="timerInput" type="number" min="0" max="100" value="3"/>
                        <span id="timerInputSuffix"></span>
                    </div>

                    <div class="form-group toggle-group">
                        <input id="devTrustedTimerCheckbox" type="checkbox">
                        <label for="devTrustedTimerCheckbox" id="devTrustedTimerCheckboxText"></label>
                    </div>

                    <div class="form-group toggle-group">
                        <input id="userTrustedTimerCheckbox" type="checkbox">
                        <label for="userTrustedTimerCheckbox" id="userTrustedTimerCheckboxText"></label>
                    </div>
                </div>

            </div>

            <div class="form-section">
                <div class="form-group toggle-group">
                    <input id="privacyModeCheckbox" type="checkbox">
                    <label for="privacyModeCheckbox" id="privacyModeCheckboxText" data-tooltip="privacyModeTooltip"></label>
                </div>

                <div class="form-group toggle-group">
                    <input id="securityModeCheckbox" type="checkbox">
                    <label for="securityModeCheckbox" id="securityModeCheckboxText" data-tooltip="securityModeTooltip"></label>
                </div>

                <div class="form-group toggle-group">
                    <input id="redirectModeCheckbox" type="checkbox">
                    <label for="redirectModeCheckbox" id="redirectModeCheckboxText" data-tooltip="redirectModeTooltip"></label>
                </div>
            </div>
        </div>

        <div id="tab2" class="tab">
            <div class="form-section">
                <h3 id="trustedDomainsTitle"></h3>

                <div class="form-group toggle-group">
                    <input id="devTrustedDomainsCheckbox" type="checkbox">
                    <label for="devTrustedDomainsCheckbox" id="devTrustedDomainsCheckboxText"></label>
                </div>

                <button id="showDevTrustedDomainsBtn"></button>
            </div>

            <div class="form-section">
                <h3 id="userTrustedDomainsTitle"></h3>
                <button id="showUserTrustedDomainsBtn"></button>

                <div class="form-group">
                    <input id="userTrustedDomainInput" type="text" placeholder="e.g., example.com">
                    <button id="addUserTrustedDomainBtn"></button>
                </div>
            </div>
        </div>

        <div id="tab3" class="tab">
            <div class="form-section">
                <p id="redirectTextOne"></p>
                <p id="redirectTextTwo"></p>
                <button id="addDefaultReferrerBtn"></button>
                <button id="showReferrerBtn"></button>
            </div>

            <div class="form-section">
                <h3 id="redirectTitle"></h3>
                <p id="redirectTextThree"></p>

                <div class="form-group">
                    <label for="referrerInputHost" id="referrerInputHostText"></label>
                    <input id="referrerInputHost" type="text" placeholder="e.g., google.*">
                </div>

                <div class="form-group">
                    <label for="referrerInputPath" id="referrerInputPathText"></label>
                    <input id="referrerInputPath" type="text" placeholder="e.g., /url?">
                </div>

                <div class="form-group">
                    <label for="referrerInputAttribute" id="referrerInputAttributeText"></label>
                    <input id="referrerInputAttribute" type="text" placeholder="e.g., q=">
                </div>

                <button id="addReferrerBtn"></button>
            </div>
		</div>
		
		<div id="tab4" class="tab">
            <div class="form-section">
                <p id="shortUrlTextOne"></p>
            </div>

            <div class="form-section">
                <h3 id="shortUrlTitle"></h3>
                <button id="showShortUrlBtn"></button>

                <div class="form-group">
                    <input id="shortUrlInput" type="text" placeholder="e.g., tiny.cc">
                    <button id="addShortUrlBtn"></button>
                </div>
            </div>
        </div>

        <div id="tab5" class="tab">
            <div class="form-section">
                <p id="tooltipTextOne"></p>
            </div>

            <div class="form-section">
                <div class="tooltip-preview">
                    <div class="tooltip-preview-section" id="tooltipPreviewUrlTitleDiv">
                        <div class="tooltip-preview-section-content">
                            <p id="tooltipPreviewUrlLongTitle"></p>
                            <p id="tooltipPreviewUrlShortTitle"></p>
                        </div>

                        <div class="tooltip-preview-section-control">
                            <input id="tooltipPreviewUrlTitleCheckbox" type="checkbox">
                        </div>
                    </div>

                    <div class="tooltip-preview-section" id="tooltipPreviewUrlDiv">
                        <div class="tooltip-preview-section-content" id="tooltipPreviewUrlLinkDiv">
                            <span id="tooltipPreviewUrlPrefix">https://secuso.aifb.</span>
                            <span id="tooltipPreviewUrlDomain" class="torpedoHighlight">kit.edu</span>
                            <span id="tooltipPreviewUrlSuffix">/index.php</span>
                            <span id="tooltipPreviewUrlBtn">[..]</span>
                        </div>

                        <div class="tooltip-preview-section-control">
                            <input id="tooltipPreviewUrlCheckbox" type="checkbox">
                        </div>
                    </div>

                    <div class="tooltip-preview-section" id="tooltipPreviewSecurityDiv">
                        <div class="tooltip-preview-section-content">
                            <p id="tooltipPreviewSecurityLong"></p>
                            <p id="tooltipPreviewSecurityShort"></p>
                        </div>

                        <div class="tooltip-preview-section-control">
                            <input id="tooltipPreviewSecurityCheckbox" type="checkbox">
                        </div>
                    </div>

                    <div class="tooltip-preview-section" id="tooltipPreviewMoreInfoDiv">
                        <div class="tooltip-preview-section-content">
                            <span>
                                <img src="img/info.png" alt="info">
                                <span id="moreInfoText"></span>
                            </span>
                        </div>

                        <div class="tooltip-preview-section-control">
                            <input id="tooltipPreviewMoreInfoCheckbox" type="checkbox">
                        </div>
                    </div>

                    <div class="tooltip-preview-section" id="tooltipPreviewTimerDiv">
                        <div class="tooltip-preview-section-content">
                            <p id="timerTextOne"></p>
                            <p id="timerTextTwo"></p>
                        </div>

                        <div class="tooltip-preview-section-control">
                            <input id="tooltipPreviewTimerCheckbox" type="checkbox">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="tab6" class="tab">
            <div class="form-section">
                <p id="tutorialTextOne"></p>
                <button id="openTutorialBtn"></button>
            </div>
        </div>
    </div>

    <div class="list-container">
		<table id="devTrustedList" class="data-table">
			<tr>
				<th id="devTrustedListTitle"></th>
			</tr>
		</table>

        <table id="userTrustedList" class="data-table">
            <tr>
                <th id="userTrustedListTitle"></th>
            </tr>
        </table>

        <table id="referrerList" class="data-table">
            <tr>
                <th id="referrerListTitle"></th>
            </tr>
        </table>

        <table id="shortUrlList" class="data-table">
            <tr>
                <th id="shortUrlListTitle"></th>
            </tr>
        </table>
	</div>

    <div id="floating-tooltip" class="floating-tooltip" role="tooltip"></div>
    <div id="toast-notification" class="toast-notification" role="status" aria-live="polite"></div>
</body>
</html>
